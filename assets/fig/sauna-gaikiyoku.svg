<svg width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="sat sad" xmlns="http://www.w3.org/2000/svg"><title id="sat">関東のゴルフ場サウナ134施設のうち外気浴まで揃うのは11</title><desc id="sad">関東1都6県のゴルフ場サウナ134施設のうち、外気浴ありと登録されているのは21施設。1件ずつ確認すると実際に成立するのは11施設で、そのうち一般に予約できるのは8施設。</desc><rect width="700" height="400" fill="#ffffff"/>
