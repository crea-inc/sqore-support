<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="266" viewBox="0 0 700 266" role="img" aria-labelledby="olyt olyd" xmlns="http://www.w3.org/2000/svg"><title id="olyt">オリンピックの精算の式</title><desc id="olyd">4人の合計点が12・8・5・1のとき、Aさんの点数12に人数4を掛けた48から全員の合計26を引いて、プラス22になる。</desc><rect width="700" height="266" fill="#ffffff"/>
<rect x="40" y="40" width="140" height="74" rx="12" fill="#0b5cab"/>
<text x="110" y="86" text-anchor="middle" font-size="34" fill="#fff" font-weight="700">12</text>
<text x="110" y="132" text-anchor="middle" font-size="13" fill="#1c1c1e">Aさん</text>
<rect x="200" y="40" width="140" height="74" rx="12" fill="#eaf3fc"/>
<text x="270" y="86" text-anchor="middle" font-size="34" fill="#0b5cab" font-weight="700">8</text>
<text x="270" y="132" text-anchor="middle" font-size="13" fill="#6e6e73">Bさん</text>
<rect x="360" y="40" width="140" height="74" rx="12" fill="#eaf3fc"/>
<text x="430" y="86" text-anchor="middle" font-size="34" fill="#0b5cab" font-weight="700">5</text>
<text x="430" y="132" text-anchor="middle" font-size="13" fill="#6e6e73">Cさん</text>
<rect x="520" y="40" width="140" height="74" rx="12" fill="#eaf3fc"/>
<text x="590" y="86" text-anchor="middle" font-size="34" fill="#0b5cab" font-weight="700">1</text>
<text x="590" y="132" text-anchor="middle" font-size="13" fill="#6e6e73">Dさん</text>
<text x="350" y="172" text-anchor="middle" font-size="16" fill="#1c1c1e" font-weight="700">（ Aさんの合計点 12 × 人数 4 ）　−　（ 全員の合計 26 ）</text>
<rect x="250" y="192" width="200" height="50" rx="14" fill="#f0a500"/>
<text x="350" y="225" text-anchor="middle" font-size="22" fill="#7a5300" font-weight="700">＝  ＋22 pt</text>
<text x="350" y="258" text-anchor="middle" font-size="11" fill="#6e6e73">ゼロサムなので、全員の増減を足すと必ず0になります</text>
</svg>