<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="270" viewBox="0 0 700 270" role="img" aria-labelledby="lvt lvd" xmlns="http://www.w3.org/2000/svg"><title id="lvt">ラスベガスの2桁の数字の作り方</title><desc id="lvd">自分4打と相棒5打で45、相手チームは5打と6打で56。差の11点が動く。</desc><rect width="700" height="270" fill="#ffffff"/>
<text x="160" y="32" text-anchor="middle" font-size="13" fill="#6e6e73">自分たちのチーム</text>
<rect x="40" y="44" width="100" height="64" rx="12" fill="#eaf3fc"/>
<text x="90" y="88" text-anchor="middle" font-size="30" fill="#0b5cab" font-weight="700">4</text>
<rect x="180" y="44" width="100" height="64" rx="12" fill="#eaf3fc"/>
<text x="230" y="88" text-anchor="middle" font-size="30" fill="#0b5cab" font-weight="700">5</text>
<text x="160" y="88" text-anchor="middle" font-size="20" fill="#6e6e73">＋</text>
<path d="M160 118 L160 140" stroke="#c9d4e0" stroke-width="2"/>
<path d="M152 132 L160 142 L168 132" fill="none" stroke="#c9d4e0" stroke-width="2"/>
<rect x="90" y="148" width="140" height="60" rx="12" fill="#0b5cab"/>
<text x="160" y="192" text-anchor="middle" font-size="34" fill="#fff" font-weight="700">45</text>
<text x="160" y="228" text-anchor="middle" font-size="11" fill="#6e6e73">小さい数字が十の位</text>
<text x="540" y="32" text-anchor="middle" font-size="13" fill="#6e6e73">相手チーム</text>
<rect x="420" y="44" width="100" height="64" rx="12" fill="#eaf3fc"/>
<text x="470" y="88" text-anchor="middle" font-size="30" fill="#0b5cab" font-weight="700">5</text>
<rect x="560" y="44" width="100" height="64" rx="12" fill="#eaf3fc"/>
<text x="610" y="88" text-anchor="middle" font-size="30" fill="#0b5cab" font-weight="700">6</text>
<text x="540" y="88" text-anchor="middle" font-size="20" fill="#6e6e73">＋</text>
<path d="M540 118 L540 140" stroke="#c9d4e0" stroke-width="2"/>
<path d="M532 132 L540 142 L548 132" fill="none" stroke="#c9d4e0" stroke-width="2"/>
<rect x="470" y="148" width="140" height="60" rx="12" fill="#5c6b7a"/>
<text x="540" y="192" text-anchor="middle" font-size="34" fill="#fff" font-weight="700">56</text>
<text x="540" y="228" text-anchor="middle" font-size="11" fill="#6e6e73">小さい数字が十の位</text>
<line x1="380" y1="60" x2="380" y2="215" stroke="#eef1f5" stroke-width="2"/>
<rect x="258" y="238" width="184" height="26" rx="10" fill="#f0a500"/>
<text x="350" y="257" text-anchor="middle" font-size="14" fill="#7a5300" font-weight="700">差の 11 点が動く</text>
</svg>