<?xml version="1.0" encoding="UTF-8"?>
<svg font-family="-apple-system,'Hiragino Sans',sans-serif" width="700" height="400" viewBox="0 0 700 400" role="img" aria-labelledby="pot pod" xmlns="http://www.w3.org/2000/svg">
<title id="pot">パーオンになる打数</title>
<desc id="pod">PAR3は1打目、PAR4は2打目、PAR5は3打目までにグリーンに乗ればパーオン。そこから2パットでパーになる。</desc>
<rect width="700" height="400" fill="#ffffff"/>
<circle cx="40" cy="26" r="11" fill="#1479d2"/><text x="58" y="34" font-size="21" fill="#3a3a3c">グリーンに乗るまで</text>
<circle cx="276" cy="26" r="11" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/><text x="294" y="34" font-size="21" fill="#3a3a3c">2パット</text>
<rect x="20" y="58" width="660" height="76" rx="12" fill="#f5f8fc" stroke="#e3e9f1"/>
<text x="40" y="105" font-size="26" font-weight="800" fill="#1c1c1e">PAR3</text>
<circle cx="150" cy="96" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="150" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
<circle cx="200" cy="96" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="200" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">2</text>
<circle cx="250" cy="96" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="250" y="104" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">3</text>
<text x="665" y="105" text-anchor="end" font-size="26" font-weight="800" fill="#0b5cab">1打目までにオン</text>
<rect x="20" y="146" width="660" height="76" rx="12" fill="#f5f8fc" stroke="#e3e9f1"/>
<text x="40" y="193" font-size="26" font-weight="800" fill="#1c1c1e">PAR4</text>
<circle cx="150" cy="184" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="150" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
<circle cx="200" cy="184" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="200" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
<circle cx="250" cy="184" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="250" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">3</text>
<circle cx="300" cy="184" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="300" y="192" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">4</text>
<text x="665" y="193" text-anchor="end" font-size="26" font-weight="800" fill="#0b5cab">2打目までにオン</text>
<rect x="20" y="234" width="660" height="76" rx="12" fill="#f5f8fc" stroke="#e3e9f1"/>
<text x="40" y="281" font-size="26" font-weight="800" fill="#1c1c1e">PAR5</text>
<circle cx="150" cy="272" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="150" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">1</text>
<circle cx="200" cy="272" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="200" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">2</text>
<circle cx="250" cy="272" r="20" fill="#1479d2" stroke="#1479d2" stroke-width="2"/>
<text x="250" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">3</text>
<circle cx="300" cy="272" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="300" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">4</text>
<circle cx="350" cy="272" r="20" fill="#ffffff" stroke="#7fb0dd" stroke-width="2"/>
<text x="350" y="280" text-anchor="middle" font-size="22" font-weight="700" fill="#0b5cab">5</text>
<text x="665" y="281" text-anchor="end" font-size="26" font-weight="800" fill="#0b5cab">3打目までにオン</text>
<rect x="20" y="330" width="660" height="56" rx="12" fill="#fff7e6"/>
<text x="350" y="367" text-anchor="middle" font-size="24" font-weight="700" fill="#a06a00">打数 − パット数 ≦ パー − 2 ならパーオン</text>
</svg>
