<title id="hjt">オネストジョンの勝敗の決まり方</title>
<desc id="hjd">Aさんは申告90で実際90なので差0、Bさんは申告85で実際88なので差3、Cさんは申告100で実際93なので差7。差がいちばん小さいAさんが勝つ。</desc>
