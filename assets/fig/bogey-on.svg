<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="276" viewBox="0 0 700 276" role="img" aria-labelledby="bot bod" xmlns="http://www.w3.org/2000/svg"><title id="bot">パーオンとボギーオンの違い</title><desc id="bod">パー4では2打でグリーンに乗ればパーオン、3打で乗ればボギーオン。</desc><rect width="700" height="276" fill="#ffffff"/>
<text x="96" y="84" text-anchor="end" font-size="15" fill="#0b5cab" font-weight="700">パーオン</text>
<text x="96" y="104" text-anchor="end" font-size="11" fill="#6e6e73">PAR4</text>
<rect x="120" y="72" width="380" height="26" rx="13" fill="#eaf3fc"/>
<ellipse cx="560" cy="85" rx="72" ry="26" fill="#e8f5e9" stroke="#bfe0c2" stroke-width="2"/>
<line x1="560" y1="85" x2="560" y2="55" stroke="#5c6b7a" stroke-width="2.5"/>
<path d="M560 55 L586 63 L560 71 Z" fill="#c0392b"/>
<circle cx="150" cy="85" r="10" fill="#0b5cab"/>
<text x="150.0" y="90" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
<circle cx="320" cy="85" r="10" fill="#0b5cab"/>
<text x="320.0" y="90" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
<text x="310" y="62" text-anchor="middle" font-size="12" fill="#0b5cab" font-weight="700">2打でグリーンへ</text>
<text x="560" y="126" text-anchor="middle" font-size="11" fill="#6e6e73">残り2パットでパー</text>
<text x="96" y="182" text-anchor="end" font-size="15" fill="#1479d2" font-weight="700">ボギーオン</text>
<text x="96" y="202" text-anchor="end" font-size="11" fill="#6e6e73">PAR4</text>
<rect x="120" y="170" width="380" height="26" rx="13" fill="#eaf3fc"/>
<ellipse cx="560" cy="183" rx="72" ry="26" fill="#e8f5e9" stroke="#bfe0c2" stroke-width="2"/>
<line x1="560" y1="183" x2="560" y2="153" stroke="#5c6b7a" stroke-width="2.5"/>
<path d="M560 153 L586 161 L560 169 Z" fill="#c0392b"/>
<circle cx="150" cy="183" r="10" fill="#1479d2"/>
<text x="150.0" y="188" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">1</text>
<circle cx="263" cy="183" r="10" fill="#1479d2"/>
<text x="263.3333333333333" y="188" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">2</text>
<circle cx="377" cy="183" r="10" fill="#1479d2"/>
<text x="376.66666666666663" y="188" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">3</text>
<text x="310" y="160" text-anchor="middle" font-size="12" fill="#1479d2" font-weight="700">3打でグリーンへ</text>
<text x="560" y="224" text-anchor="middle" font-size="11" fill="#6e6e73">残り2パットでボギー</text>
<text x="350" y="266" text-anchor="middle" font-size="11" fill="#6e6e73">SQOREはこの2つを別々に数えます。世間の「7割で80台」はボギーオン以下（＝両方の合計）を指すことが多い</text>
</svg>