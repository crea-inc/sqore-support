<svg width="700" height="340" viewBox="0 0 700 340" role="img" aria-labelledby="ppt ppd" xmlns="http://www.w3.org/2000/svg"><title id="ppt">本来のピンポンパンの点の取り方</title><desc id="ppd">1ホールごとに、最初にグリーンにオンした人がピン、全員オンの時点で最もピンに近い人がポン、最初にカップインした人がパンで、それぞれ1点。18ホールの合計点で競う。</desc><rect width="700" height="340" fill="#ffffff"/>
<text x="25" y="26" font-size="14" fill="#1c1c1e" font-weight="700">本来のピンポンパン ― 1ホールで3点が動く</text>
