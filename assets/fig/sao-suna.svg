<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="330" viewBox="0 0 700 330" role="img" aria-labelledby="sst ssd" xmlns="http://www.w3.org/2000/svg">
<title id="sst">竿の1パットと3パットのポイントの動き</title>
<desc id="ssd">4人で1打10ポイントの場合。Aさんが1パットならB・C・Dさんから10ずつ受け取りAさん+30、ほかの3人は−10。Aさんが3パットならB・C・Dさんに10ずつ払いAさん−30、ほかの3人は+10。砂は出して1打なら各10、直接なら各20を全員から受け取る。</desc>
<defs><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#0b5cab"/></marker><marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" fill="#d0342c"/></marker></defs>
<rect width="700" height="330" fill="#ffffff"/>
