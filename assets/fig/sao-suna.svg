<text x="170" y="220" text-anchor="middle" font-size="14" font-weight="700" fill="#1c1c1e">C</text>
<text x="170" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#d0342c">−10</text>
<line x1="280" y1="190" x2="190" y2="130" stroke="#0b5cab" stroke-width="3" marker-end="url(#ahr)"/>
<text x="255" y="164" text-anchor="middle" font-size="13" font-weight="700" fill="#0b5cab">10</text>
